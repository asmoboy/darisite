<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kreisel – Communities entdecken</title>
  <meta name="description" content="Entdecke Communities zu Business, Fitness, Kreativem und mehr – oder erstelle deine eigene.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <button class="brand" type="button" aria-haspopup="true" aria-label="Menü öffnen">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__word">kreisel</span>
        <svg class="brand__caret" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="header__actions">
        <button class="icon-btn" type="button" aria-label="Sprache wählen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <a class="btn-outline" href="#">Anmelden</a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1 class="hero__title">Finde deine Community</h1>
      <p class="hero__sub">Lerne mit Menschen, die dasselbe wollen wie du – <a href="#">oder erstelle deine eigene</a></p>

      <label class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="sr-only">Communities durchsuchen</span>
        <input id="search" type="search" placeholder="Nach allem suchen" autocomplete="off">
      </label>
    </section>

    <nav class="filters" aria-label="Kategorien">
      <div class="filters__scroll" id="filters" role="tablist"></div>
      <div class="filters__end">
        <button class="pill" type="button">Mehr…</button>
        <button class="pill pill--icon" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          Filter
        </button>
      </div>
    </nav>

    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="empty" id="empty" hidden>Keine Communities gefunden. Probier einen anderen Suchbegriff.</p>

    <nav class="pagination" id="pagination" aria-label="Seiten"></nav>
  </main>

  <footer class="footer">
    <nav class="footer__links">
      <a href="#">Community</a>
      <a href="#">Affiliates</a>
      <a href="#">Support</a>
      <a href="#">Karriere</a>
    </nav>
  </footer>

  <script src="app.js"></script>
</body>
</html>
